<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a2632" />
    <title>Harmonica · 启动</title>
    <link rel="icon" href="../../public/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Inter", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei",
          "PingFang SC", system-ui, sans-serif;
        --ink: #f2f6fa;
        --muted: #9fb0c0;
        --faint: #6f8194;
        --brand: #a8c6de;
        --accent: #7fb3d9;
        --card: #1e2b38;
        --line: #ffffff14;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-width: 280px;
        min-height: 100%;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 26px;
        color: var(--ink);
        background:
          radial-gradient(120% 70% at 22% 0%, #2f455a 0, transparent 58%),
          radial-gradient(90% 60% at 88% 100%, #243a4c 0, transparent 60%),
          #141e27;
      }
      .card {
        width: min(430px, 100%);
        padding: 34px 30px 26px;
        text-align: center;
        background: color-mix(in srgb, var(--card) 94%, #fff 6%);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow:
          0 26px 70px #00000059,
          inset 0 1px 0 #ffffff0d;
      }
      .logo {
        display: block;
        width: 66px;
        height: 66px;
        margin: 0 auto 16px;
        border-radius: 16px;
        filter: drop-shadow(0 10px 22px #0000004d);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.3px;
      }
      .description {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.75;
      }
      .status {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin: 26px 0 6px;
        font-size: 13px;
        color: #dbe7f1;
      }
      .spinner {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
        border: 2px solid #3f5568;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      .spinner[hidden] {
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .endpoint {
        margin: 0 0 20px;
        font-size: 11px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.3px;
      }
      .actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 9px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          filter 0.15s ease,
          background 0.15s ease,
          transform 0.15s ease;
      }
      button:hover {
        filter: brightness(1.08);
      }
      button:active {
        transform: translateY(1px);
      }
      .primary {
        background: linear-gradient(180deg, #cfe3f3, #a8c6de);
        color: #16232e;
      }
      .secondary {
        background: #2a3a49;
        color: #d5e2ec;
        box-shadow: inset 0 0 0 1px #ffffff10;
      }
      .hint {
        min-height: 17px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.7;
      }
      .hint code {
        font: inherit;
        color: var(--brand);
      }
      #diagnostics {
        margin-top: 20px;
        text-align: left;
        font-size: 12px;
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      #detail {
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        font: inherit;
      }
      #detail:empty {
        display: none;
      }
      #logs a {
        display: block;
        margin-top: 8px;
        color: var(--brand);
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      @media (max-width: 420px) {
        body {
          padding: 16px;
        }
        .card {
          padding: 28px 20px 22px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <img class="logo" src="../../public/favicon.svg" alt="" />
      <h1>Harmonica</h1>
      <p class="description">先确认本机服务，准备好后在当前标签页进入。</p>
      <div class="status">
        <span class="spinner" id="spinner" aria-hidden="true"></span
        ><span id="status">正在检查启动入口…</span>
      </div>
      <p class="endpoint" id="endpoint"></p>
      <div class="actions">
        <button class="primary" id="open" type="button">启动并进入</button>
        <button class="secondary" id="retry" type="button">重试启动</button>
      </div>
      <p class="hint" id="hint">
        浏览器若询问是否打开 Harmonica，请选择“允许”。
      </p>
      <section id="diagnostics" hidden aria-label="启动诊断">
        <pre id="detail"></pre>
        <div id="logs"></div>
      </section>
      <a id="protocol" target="_self" hidden aria-hidden="true"></a>
      <noscript>启动入口需要 JavaScript。请允许此页面运行脚本后刷新。</noscript>
    </main>
    <script
      src="launch-harmonica.js"
      onerror="
        document.getElementById('spinner').hidden = true;
        document.getElementById('status').textContent = '启动页脚本未加载';
        document.getElementById('hint').textContent =
          '请确认同目录的 launch-harmonica.js 文件存在，再刷新书签。';
      "
    ></script>
  </body>
</html>
