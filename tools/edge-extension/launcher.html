<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正在启动 Harmonica…</title>
    <link rel="icon" href="icons/icon128.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Inter", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei",
          "PingFang SC", system-ui, sans-serif;
        --ink: #f2f6fa;
        --muted: #9fb0c0;
        --faint: #6f8194;
        --accent: #a8c6de;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 26px;
        color: var(--ink);
        background:
          radial-gradient(120% 70% at 22% 0%, #2f455a 0, transparent 58%),
          radial-gradient(90% 60% at 88% 100%, #243a4c 0, transparent 60%),
          #141e27;
      }
      .card {
        width: min(430px, 100%);
        padding: 34px 30px 26px;
        text-align: center;
        background: #1e2b38f0;
        border: 1px solid #ffffff14;
        border-radius: 20px;
        box-shadow:
          0 26px 70px #00000059,
          inset 0 1px 0 #ffffff0d;
      }
      .logo {
        display: block;
        width: 66px;
        height: 66px;
        margin: 0 auto 16px;
        border-radius: 16px;
        filter: drop-shadow(0 10px 22px #0000004d);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.3px;
      }
      .description {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.75;
      }
      .status {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin: 26px 0 6px;
        font-size: 13px;
        color: #dbe7f1;
      }
      .spinner {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
        border: 2px solid #3f5568;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      .spinner[hidden] {
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .endpoint {
        margin: 0 0 20px;
        font-size: 11px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 9px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          filter 0.15s ease,
          transform 0.15s ease;
      }
      button:hover {
        filter: brightness(1.08);
      }
      button:active {
        transform: translateY(1px);
      }
      .primary {
        background: linear-gradient(180deg, #cfe3f3, #a8c6de);
        color: #16232e;
      }
      .secondary {
        background: #2a3a49;
        color: #d5e2ec;
        box-shadow: inset 0 0 0 1px #ffffff10;
      }
      .hint {
        min-height: 17px;
        margin: 18px 0 0;
        color: var(--faint);
        font-size: 11.5px;
        line-height: 1.7;
      }
      .hint code {
        font: inherit;
        color: var(--accent);
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <img class="logo" src="icons/icon128.png" alt="" />
      <h1>Harmonica</h1>
      <p class="description">正在通过本机协议拉起写谱台，准备好后会自动进入。</p>
      <div class="status">
        <span class="spinner" id="spinner" aria-hidden="true"></span
        ><span id="status">正在启动 Harmonica…</span>
      </div>
      <p class="endpoint" id="endpoint"></p>
      <div class="actions">
        <button class="primary" id="open" type="button">打开写谱台</button>
        <button class="secondary" id="retry" type="button">再试一次</button>
      </div>
      <p class="hint" id="hint">
        如果 Edge 询问是否打开 Harmonica，请选择“允许”。
      </p>
    </main>
    <script src="launcher.js"></script>
  </body>
</html>
