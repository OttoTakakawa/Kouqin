<div class="phrase"><span class="lineno">02</span><button class="note" style="font-size:35px;--size:35px">1</button><button class="note" style="font-size:30px;--size:30px">(7</button><button class="note" style="font-size:25px;--size:25px">6</button><button class="note" style="font-size:35px;--size:35px">7)</button><span class="gap"></span><button class="note" style="font-size:29px;--size:29px">(6</button><button class="note" style="font-size:35px;--size:35px">7)</button><button class="note" style="font-size:40px;--size:40px">1</button><button class="note" style="font-size:40px;--size:40px">1</button></div>
<div class="phrase"><span class="lineno">03</span><button class="note" style="font-size:33px;--size:33px">5</button><span class="gap"></span><button class="note" style="font-size:42px;--size:42px">[2]</button><span class="gap"></span><button class="note" style="font-size:35px;--size:35px">[#1]</button><button class="note" style="font-size:26px;--size:26px">5</button><button class="note" style="font-size:28px;--size:28px">4</button><button class="note" style="font-size:28px;--size:28px">3</button><span class="gap"></span><button class="note" style="font-size:40px;--size:40px">[1]</button></div>
<div class="phrase"><span class="lineno">04</span><button class="note" style="font-size:30px;--size:30px">3</button><button class="note" style="font-size:30px;--size:30px">3</button><button class="note" style="font-size:42px;--size:42px">3</button><span class="gap"></span><button class="note" style="font-size:27px;--size:27px">1</button><button class="note" style="font-size:34px;--size:34px">2</button><button class="note" style="font-size:40px;--size:40px">1</button><button class="note" style="font-size:44px;--size:44px">1</button></div><div class="emptyline"><span class="lineno">05</span><span class="caret"></span><span>继续输入下一句…</span></div></div>
<div class="selection"><span class="muted">当前音符</span><strong id="current">2</strong><span style="border-left:1px solid var(--line);height:20px"></span><span>音长</span><button id="shorter" title="C 缩短">−</button><span class="value" id="duration">1.50</span><button id="longer" title="Z 延长">＋</button><span class="muted">相对长度</span><label style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="fine">细调</label><span class="desc">长音更大，短音更轻</span></div>
<div class="keyboard"><span><kbd>1–7</kbd> 输入</span><span><kbd>Shift</kbd> 高音</span><span><kbd>Ctrl</kbd> 低音</span><span><kbd>Alt</kbd> 推键 #</span><span><kbd>Z</kbd> 延长 / <kbd>C</kbd> 缩短</span></div></main>

</div>
<div class="transport"><button class="play" id="play">▶ 试听旋律</button><button class="quiet" id="stop">■ 停止</button><select id="scope" aria-label="播放范围"><option>整首</option><option>当前句</option></select><label><input type="checkbox" id="loop">循环</label><div class="divider"></div><label>速度 <input type="number" value="90" min="30" max="240" aria-label="速度"><span class="muted">BPM</span></label><label>音色 <select aria-label="音色"><option>合成音</option><option disabled>口琴（待接入）</option></select></label><div class="right"><span class="sound-bars"><i></i><i></i><i></i><i></i><i></i></span> 跟随旋律 <label style="margin-top:4px"><input type="checkbox" checked id="effects">音符特效</label></div></div>
</div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let selected=$('.chosen'),duration=1.5,timer=null,idx=0;
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2400)}
function selectNote(n){selected.classList.remove('chosen');selected=n;n.classList.add('chosen');duration=Number(n.dataset.duration||1);$('#current').textContent=n.textContent;$('#duration').textContent=duration.toFixed(2)}
$$('.note').forEach(n=>{n.dataset.duration=n.classList.contains('chosen')?'1.5':'1';n.onclick=()=>selectNote(n)});
function adjust(d){duration=Math.min(8,Math.max(.125,duration+d*($('#fine').checked?.025:.125)));selected.dataset.duration=duration;const size=Math.min(54,Math.max(22,30+Math.log2(duration)*13));selected.style.fontSize=size+'px';selected.style.setProperty('--size',size+'px');$('#duration').textContent=duration.toFixed(2)}
$('#longer').onclick=()=>adjust(1);$('#shorter').onclick=()=>adjust(-1);
$('#score').addEventListener('keydown',e=>{if(e.key.toLowerCase()==='z'||e.key.toLowerCase()==='c'){e.preventDefault();adjust(e.key.toLowerCase()==='z'?1:-1)}});
$('#practice').onclick=()=>{$('#app').classList.add('practice');$('#practice').classList.add('active');$('#edit').classList.remove('active')};$('#edit').onclick=()=>{$('#app').classList.remove('practice');$('#edit').classList.add('active');$('#practice').classList.remove('active')};

$('#search').oninput=e=>$$('.song').forEach(n=>n.hidden=!n.textContent.toLowerCase().includes(e.target.value.toLowerCase()));
function stop(){clearTimeout(timer);timer=null;$$('.note').forEach(n=>n.classList.remove('playing'));$('#play').textContent='▶ 播放'}
function step(notes){if(idx>=notes.length){if($('#loop').checked)idx=0;else return stop()}$$('.note').forEach(n=>n.classList.remove('playing'));const n=notes[idx++];if($('#effects').checked)n.classList.add('playing');else{n.classList.add('playing');n.style.setProperty('animation','none')}n.scrollIntoView({block:'nearest'});timer=setTimeout(()=>step(notes),Number(n.dataset.duration)*60000/Number($('input[type=number]').value||90))}
$('#play').onclick=()=>{if(timer)return stop();idx=0;$('#play').textContent='Ⅱ 暂停';const notes=$('#scope').value==='当前句'?[...selected.closest('.phrase').querySelectorAll('.note')]:$$('.note');step(notes)};$('#stop').onclick=()=>{stop();idx=0};
$('#save').onclick=()=>toast('这是布局原型；正式版将保存到本地乐谱库');$('#settings').onclick=()=>toast('预留：高低音修饰键、推键、音长增减、换行等按键自定义');$('#import').onclick=()=>toast('预留：导入 Luna 等模型输出的 JSON 转谱草稿');$('#new').onclick=()=>{$('#title').value='未命名乐谱';toast('新建流程示意；当前谱面用于布局预览')};$$('.song').forEach(n=>n.onclick=()=>toast('曲目列表示意，原型未连接真实乐谱库'));
const effectsKey='harmonica.noteEffects.v1';
function applyEffects(enabled){$('#effects').checked=enabled;$('#app').classList.toggle('no-effects',!enabled)}
let savedEffects=null;try{savedEffects=localStorage.getItem(effectsKey)}catch{}
applyEffects(savedEffects===null?!window.matchMedia('(prefers-reduced-motion: reduce)').matches:savedEffects==='true');
$('#effects').onchange=()=>{applyEffects($('#effects').checked);try{localStorage.setItem(effectsKey,String($('#effects').checked))}catch{toast('当前浏览器无法记住设置，本次仍然生效')}};
</script><style>.no-effects .note.playing:after{display:none}</style>
</body></html>
